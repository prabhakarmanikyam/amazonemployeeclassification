name: ML Project CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn matplotlib seaborn scipy xgboost nbformat

      - name: Validate notebook JSON + required files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('prabhaker_manikyam.ipynb'),
              Path('amazon_employee_access_train.csv'),
              Path('README.md'),
          ]

          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f"Missing required project files: {missing}")

          with open('prabhaker_manikyam.ipynb', 'r', encoding='utf-8') as f:
              nb = json.load(f)

          if 'cells' not in nb or not isinstance(nb['cells'], list) or len(nb['cells']) == 0:
              raise SystemExit('Notebook is invalid: missing non-empty cells list')

          print('Notebook and required files look valid.')
          PY

      - name: Dataset schema smoke check
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv('amazon_employee_access_train.csv')
          expected_cols = {
              'ACTION', 'RESOURCE', 'MGR_ID', 'ROLE_ROLLUP_1', 'ROLE_ROLLUP_2',
              'ROLE_DEPTNAME', 'ROLE_TITLE', 'ROLE_FAMILY_DESC', 'ROLE_FAMILY', 'ROLE_CODE'
          }

          missing = expected_cols - set(df.columns)
          if missing:
              raise SystemExit(f'Missing expected columns: {sorted(missing)}')

          if df.empty:
              raise SystemExit('Training dataset is empty')

          print(f'Dataset shape: {df.shape}')
          print('Dataset schema smoke check passed.')
          PY
